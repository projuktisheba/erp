<div class="flex flex-col h-full fade-in space-y-4">

    <div class="bg-white p-2 md:p-2 rounded-xl shadow-sm border border-slate-200">
        <div class="flex flex-col xl:flex-row justify-between items-start xl:items-center gap-4">

            <div class="flex flex-col md:flex-row gap-3 w-full xl:w-auto items-center">
                
                <div class="relative w-full md:w-64">
                    <input id="searchCustomerInput" type="text" placeholder="Search Name or Mobile..."
                        class="pl-9 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none w-full transition-all shadow-sm">
                    <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
                </div>

                <div class="w-full md:w-40">
                    <div class="relative">
                        <select id="dueFilterSelector"
                            class="appearance-none w-full border border-slate-300 rounded-lg pl-3 pr-8 py-2 text-sm bg-white outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 shadow-sm cursor-pointer font-medium text-slate-700">
                            <option value="all">All Customers</option>
                            <option value="due">Due Only</option>
                            <option value="no_due">No Due</option>
                        </select>
                        <i class="ph ph-caret-down absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-xs"></i>
                    </div>
                </div>
            </div>

            <div class="flex flex-col md:flex-row gap-3 w-full xl:w-auto">

                <div class="flex gap-2 w-full md:w-auto">
                    <button onclick="printCustomerReport()" 
                        class="flex-1 md:flex-none justify-center bg-slate-600 hover:bg-slate-700 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-lg shadow-slate-600/20 transition flex items-center gap-2 whitespace-nowrap">
                        <i class="ph ph-printer font-bold"></i>
                        <span>Print</span>
                    </button>

                    <button onclick="openCustomerModal()"
                        class="flex-1 md:flex-none justify-center bg-brand-600 hover:bg-brand-700 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-lg shadow-brand-600/20 transition flex items-center gap-2 whitespace-nowrap">
                        <i class="ph ph-plus font-bold"></i>
                        <span>Add</span>
                    </button>

                    <div class="relative">
                        <select id="pageLengthSelector"
                            class="appearance-none w-20 border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 shadow-sm cursor-pointer text-center font-medium text-slate-700">
                            <option value="10" selected>10</option>
                            <option value="25">25</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                        </select>
                        <i class="ph ph-caret-down absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-xs"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="flex-1 bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
        <div class="overflow-x-auto flex-1 w-full">
            <table id="customerTable" class="w-full text-left text-sm whitespace-nowrap">
                <thead class="bg-slate-50 text-slate-500 sticky top-0 z-10 border-b border-slate-200 font-semibold uppercase text-xs tracking-wider">
                    <tr>
                        <th class="px-4 py-3 md:px-6">Customer</th>
                        <th class="px-4 py-3 md:px-6">Mobile</th>
                        <th class="hidden md:table-cell px-6 py-3">Address / Tax</th>
                        <th class="px-4 py-3 md:px-6 text-right">Due</th>
                        <th class="hidden sm:table-cell px-6 py-3 text-center">Status</th>
                        <th class="px-4 py-3 md:px-6 text-center">Action</th>
                    </tr>
                </thead>
                <tbody id="customerTableBody" class="divide-y divide-slate-100">
                </tbody>
            </table>
            
            <div id="emptyState" class="hidden flex flex-col items-center justify-center py-20 text-center">
                <div class="w-20 h-20 bg-slate-50 rounded-full flex items-center justify-center mb-4">
                    <i class="ph ph-users text-4xl text-slate-300"></i>
                </div>
                <h3 class="text-lg font-bold text-slate-700">No customers found</h3>
                <p class="text-slate-400 text-sm mt-1">Try adjusting your filters or add a new customer.</p>
            </div>
        </div>
    </div>

    <div class="px-2 py-2 sm:p-2 border-t border-slate-200 bg-slate-50 flex flex-col sm:flex-row justify-between items-center gap-2 sm:gap-0">
        <p class="text-xs sm:text-sm text-slate-500 font-medium order-2 sm:order-1 text-center sm:text-left"
            id="paginationInfo">
            Showing 0-0 of 0 results
        </p>

        <div id="paginationContainer"
            class="flex flex-wrap gap-1 sm:gap-2 items-center justify-center order-1 sm:order-2">
        </div>
    </div>
</div>

<div id="customerModal" class="hidden flex fixed inset-0 z-50 items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4 fade-in">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-4xl max-h-[90vh] overflow-y-auto flex flex-col">
        <div class="px-6 py-4 border-b flex justify-between items-center sticky top-0 bg-white z-10">
            <h3 class="font-bold text-lg text-slate-800" id="modalTitle">New Customer</h3>
            <button onclick="closeCustomerModal()"
                class="text-slate-400 border px-2 py-1/2 rounded hover:text-red-500 text-2xl">&times;</button>
        </div>

        <form onsubmit="handleSaveCustomer(event)" class="p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
            <input type="hidden" id="customerId">
            <input type="hidden" id="inputCountry" value="Qatar">
            <input type="hidden" id="inputCountryCode" value="974">

            <div class="space-y-4">
                <h4 class="font-bold text-brand-600 text-sm uppercase border-b pb-1">Basic Info</h4>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Full Name</label>
                    <input type="text" id="inputName" required placeholder="Customer Full Name"
                        class="w-full border border-slate-300 rounded p-2 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Mobile (WhatsApp)</label>
                    <div class="relative flex items-center">
                        <button type="button" id="countrySelectBtn" onclick="toggleCountryDropdown(event)"
                            class="flex items-center gap-1.5 h-10 px-3 bg-slate-100 hover:bg-slate-200 border border-r-0 border-slate-300 rounded-l-lg text-sm font-semibold text-slate-700 transition shrink-0 outline-none">
                            <span id="selectedCountryFlag">🇶🇦</span>
                            <span id="selectedCountryDialCode" class="text-xs font-bold text-slate-800">+974</span>
                            <i class="ph ph-caret-down text-slate-500 text-xs"></i>
                        </button>

                        <div id="countryDropdown" style="height: 320px !important; max-height: 320px !important;" class="hidden absolute left-0 top-full mt-1.5 z-50 w-72 bg-white border border-slate-200 rounded-xl shadow-2xl overflow-hidden flex flex-col ring-1 ring-slate-900/5">
                            <div class="p-2.5 border-b border-slate-100 bg-slate-50/80 backdrop-blur-xs shrink-0">
                                <div class="relative flex items-center">
                                    <i class="ph ph-magnifying-glass absolute left-3 text-slate-400 text-sm pointer-events-none"></i>
                                    <input type="text" id="countrySearchInput" onkeyup="filterCountryList(this.value)" placeholder="Search country or dial code..."
                                        class="w-full pl-9 pr-3 py-2 text-xs font-medium border border-slate-200 rounded-lg outline-none bg-white focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition-all shadow-xs text-slate-800 placeholder:text-slate-400">
                                </div>
                            </div>
                            <div id="countryListContainer" style="height: 260px !important; max-height: 260px !important; overflow-y: auto !important;" class="flex-1 overflow-y-auto min-h-0 divide-y divide-slate-100 text-xs">
                            </div>
                        </div>

                        <input type="text" id="inputMobile" placeholder="55016898" required
                            class="w-full h-10 border border-slate-300 rounded-r-lg px-3 text-sm outline-none focus:border-brand-500 focus:bg-white transition-all">
                    </div>
                    <p class="text-[10px] text-slate-400 mt-1">Country code and number will be stored separately for WhatsApp invoices.</p>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Tax ID</label>
                    <input type="text" id="inputTaxId" placeholder="Optional Tax / VAT ID" class="w-full border border-slate-300 rounded p-2 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Address</label>
                    <textarea id="inputAddress" rows="2" placeholder="Customer address details..."
                        class="w-full border border-slate-300 rounded p-2 text-sm"></textarea>
                </div>
                <div class="pt-1">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="inputStatus" class="w-4 h-4 text-brand-600 rounded">
                        <span class="text-sm font-medium text-slate-700">Active Account</span>
                    </label>
                </div>
            </div>

            <div class="space-y-4">
                <h4 class="font-bold text-brand-600 text-sm uppercase border-b pb-1">Measurements</h4>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] uppercase font-bold text-slate-500 mb-1">Length</label>
                        <input id="measureLength" placeholder="e.g. 54" class="w-full border border-slate-300 rounded p-2 text-sm focus:border-brand-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] uppercase font-bold text-slate-500 mb-1">Shoulder</label>
                        <input id="measureShoulder" placeholder="e.g. 15" class="w-full border border-slate-300 rounded p-2 text-sm focus:border-brand-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] uppercase font-bold text-slate-500 mb-1">Bust</label>
                        <input id="measureBust" placeholder="e.g. 38" class="w-full border border-slate-300 rounded p-2 text-sm focus:border-brand-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] uppercase font-bold text-slate-500 mb-1">Waist</label>
                        <input id="measureWaist" placeholder="e.g. 34" class="w-full border border-slate-300 rounded p-2 text-sm focus:border-brand-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] uppercase font-bold text-slate-500 mb-1">Hip</label>
                        <input id="measureHip" placeholder="e.g. 42" class="w-full border border-slate-300 rounded p-2 text-sm focus:border-brand-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] uppercase font-bold text-slate-500 mb-1">Arm Hole</label>
                        <input id="measureArmHole" placeholder="e.g. 18" class="w-full border border-slate-300 rounded p-2 text-sm focus:border-brand-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] uppercase font-bold text-slate-500 mb-1">Sleeve Length</label>
                        <input id="measureSleeveL" placeholder="e.g. 22" class="w-full border border-slate-300 rounded p-2 text-sm focus:border-brand-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] uppercase font-bold text-slate-500 mb-1">Sleeve Width</label>
                        <input id="measureSleeveW" placeholder="e.g. 14" class="w-full border border-slate-300 rounded p-2 text-sm focus:border-brand-500 outline-none">
                    </div>
                    <div class="col-span-2">
                        <label class="block text-[11px] uppercase font-bold text-slate-500 mb-1">Round Width</label>
                        <input id="measureRoundW" placeholder="e.g. 16" class="w-full border border-slate-300 rounded p-2 text-sm focus:border-brand-500 outline-none">
                    </div>
                </div>
            </div>

            <div class="md:col-span-2 flex justify-end gap-3 pt-4 border-t">
                <button type="button" onclick="closeCustomerModal()"
                    class="px-4 py-2 border text-slate-600 hover:bg-slate-100 rounded-lg font-bold text-sm">Cancel</button>
                <button type="submit" id="customerSubmitBtn"
                    class="bg-brand-600 text-white px-6 py-2 rounded-lg font-bold text-sm shadow">
                    <i class="fa-solid fa-floppy-disk mr-2"></i>Save
                </button>
            </div>
        </form>
    </div>
</div>
